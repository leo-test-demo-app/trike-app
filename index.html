:root{--bg:#e8f1f4;--plate:#ffc933;--plate-ink:#1a1400;

@media (prefers-color-scheme:dark){:root{--bg:#0c1822;
  --weave:url("data:image/svg+xml,%3Csvg xmlns='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnD9wvipeRSfUeSuH19u1cJ4TpvM3XpdZBrcjLbHya2g&s=10' width='48' height='48' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%235db8e8' stroke-width='2'%3E%3Cpath d='M24 2L46 24 24 46 2 24Z'/%3E%3Cpath d='M24 14L34 24 24 34 14 24Z'/%3E%3C/g%3E%3C/svg%3E");--weave-op:.07}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow-x:hidden;font-family:"Figtree",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:var(--weave);background-size:48px 48px;opacity:var(--weave-op)}
main{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.plate{width:100%;max-width:420px;background:var(--plate);color:var(--plate-ink);border-radius:16px;padding:24px 22px;text-align:center;border:3px solid var(--plate-ink);box-shadow:0 0 0 3px var(--plate)}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(1.9rem,9vw,3.2rem);line-height:1;margin:0;white-space:nowrap;letter-spacing:-.01em}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,14px)}
.trike{width:clamp(50px,15vw,84px);height:auto;flex:none;color:var(--plate-ink)}
</style>
</head>

        <circle cx="26" cy="58" r="3.4"/><circle cx="86" cy="60" r="3"/>

    </svg>
    <h1>Site closed.</h1>
    </div>
  </section>
  </main>
</body>
</html>
